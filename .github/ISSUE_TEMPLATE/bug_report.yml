name: 功能问题报告
description: 报告可以稳定复现的 TaloKit 桌面应用问题
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: 请勿提交账号密码、令牌、私钥、订单、支付信息或未脱敏的生产数据。
  - type: input
    id: version
    attributes:
      label: TaloKit 版本
      placeholder: 例如 0.8.1
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options: [Windows x64, Windows ARM64, macOS Intel, macOS Apple Silicon, Linux x64, Linux ARM64]
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: 工具或模块
      placeholder: 例如 Kubernetes YAML / JSON / 目录 Diff
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 使用不含敏感数据的最小示例。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果和完整错误文字
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已删除账号、令牌、密钥、订单和生产数据。
          required: true
