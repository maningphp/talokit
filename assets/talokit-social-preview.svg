<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">TaloKit — Offline-first developer toolkit</title>
  <desc id="desc">Windows, macOS and Linux desktop tools for JSON, YAML, Base64, Hash, SQL, Diff, Docker and Kubernetes. Brand artwork, not an application screenshot.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#111f32"/>
      <stop offset="1" stop-color="#080f1c"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#38d5d1"/>
      <stop offset="1" stop-color="#1b4861"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="6" fill="url(#edge)"/>
  <g fill="none" stroke="#38d5d1" opacity=".12">
    <circle cx="1140" cy="80" r="160"/>
    <circle cx="1140" cy="80" r="215"/>
    <circle cx="1140" cy="80" r="270"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="80" y="64" font-size="16" font-weight="600" letter-spacing="3" fill="#8ce9e4">DEVELOPER TOOLS · ONE WORKSPACE</text>
    <g transform="translate(80 103) scale(1.5)">
      <rect x="3" y="3" width="58" height="58" rx="14" fill="#152033" stroke="#284059" stroke-width="3"/>
      <path d="M35 11 20 30l9 4-7 19 22-25-10-4 8-13z" fill="#38d5d1"/>
      <path d="M21 17c-7 3-10 8-10 15s3 12 10 15M45 17c6 3 9 8 9 15s-3 12-9 15" fill="none" stroke="#8ce9e4" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="200" y="181" font-size="88" font-weight="700" letter-spacing="-3" fill="#f2f7fc">TaloKit</text>
    <text x="80" y="266" font-size="40" font-weight="600" letter-spacing="-1" fill="#f2f7fc">Your everyday developer toolkit.</text>
    <text x="80" y="309" font-size="24" fill="#a5b7cd">Offline-first. Local processing. Built for your desktop.</text>
    <g fill="#142439" stroke="#2c415b">
      <rect x="80" y="360" width="354" height="116" rx="16"/>
      <rect x="452" y="360" width="300" height="116" rx="16"/>
      <rect x="770" y="360" width="430" height="116" rx="16"/>
    </g>
    <g font-size="14" letter-spacing="2" font-weight="600" fill="#8ce9e4">
      <text x="104" y="394">FORMAT &amp; TRANSFORM</text>
      <text x="476" y="394">INSPECT &amp; COMPARE</text>
      <text x="794" y="394">CONTAINERS &amp; YAML</text>
    </g>
    <g font-size="24" font-weight="600" fill="#f2f7fc">
      <text x="104" y="441">JSON · YAML · Base64 · Hash</text>
      <text x="476" y="441">SQL · Text &amp; File Diff</text>
      <text x="794" y="441">Docker · Kubernetes</text>
    </g>
    <line x1="80" y1="525" x2="1200" y2="525" stroke="#2c415b"/>
    <text x="80" y="577" font-size="23" font-weight="600" fill="#d1deed">Windows  /  macOS  /  Linux</text>
    <text x="1200" y="577" text-anchor="end" font-size="23" font-weight="600" fill="#8ce9e4">www.talokit.com</text>
  </g>
